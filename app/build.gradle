plugins { id 'com.android.application' }

android {
    namespace 'de.gymlog.app'
    compileSdk 35
    defaultConfig {
        applicationId 'de.gymlog.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('../gymlog.keystore')
            storePassword 'gymlog123'
            keyAlias 'gymlog'
            keyPassword 'gymlog123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
